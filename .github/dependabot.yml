version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      dev-tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript*'
          - 'prettier*'
          - 'vitest*'
      # Catch-all so single-package minor/patch bumps (sharp, globals,
      # pagefind, ...) arrive in one weekly PR instead of one PR each.
      # Majors stay ungrouped so they still get individual review.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # Major runtime/toolchain upgrades must be coordinated with the CI matrix
    # and Astro's peer ranges instead of being merged as unattended bundles.
    ignore:
      - dependency-name: 'astro'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-astro'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
